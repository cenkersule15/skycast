name: Tests and Docker
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: docker build -t skycast-test .
      - run: |
          docker run -d --name skycast-check -p 8502:8502 skycast-test
          for i in $(seq 1 30); do
            if curl --fail http://localhost:8502/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs skycast-check
          exit 1
